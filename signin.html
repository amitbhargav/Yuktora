<!DOCTYPE html>
<html lang="en">

<style>
  <!-- ═══════════════════════════════════════════════════════════════════
  MOCHA MARBLE THEME — Phase 3.8 visual polish Paste at the end of <style>. Order matters: this must come AFTER existing rules to override cleanly. ═══════════════════════════════════════════════════════════════════
  -->
  :root
  {
  --page-bg:
  #efe8dd;
  --card-bg:
  #ffffff;
  --border:
  #d9c8ab;
  --text-primary:
  #2b1e14;
  --text-secondary:
  #6b5540;
  --brand:
  #4a2c1a;
  --brand-hover:
  #3a1f10;
  --brand-text:
  #efe8dd;
  --eyebrow-bg:
  #e3d5bc;
  --eyebrow-text:
  #6b3d1a;
  --eyebrow-dot:
  #a8683a;
  --success-bg:
  #e5efdb;
  --success-text:
  #3d6a3d;
  --divider:
  #ede2ca;
  --shadow-warm:
  0
  1px
  2px
  rgba(74,
  44,
  26,
  0.04),
  0
  8px
  24px
  rgba(74,
  44,
  26,
  0.06);
  --font-heading:
  'Fraunces',
  Georgia,
  serif;
  --font-body:
  'Inter
  Tight',
  system-ui,
  -apple-system,
  sans-serif;
  }
  /*
  Base
  surface
  */
  html,
  body
  {
  background:
  var(--page-bg)
  !important;
  color:
  var(--text-primary);
  font-family:
  var(--font-body);
  }
  /*
  Headings
  —
  serif
  with
  tight
  tracking
  */
  h1,
  h2,
  h3,
  h4,
  .hero-title,
  .page-title,
  .section-title
  {
  font-family:
  var(--font-heading);
  font-weight:
  400;
  letter-spacing:
  -0.5px;
  color:
  var(--text-primary);
  }
  /*
  Italic
  phrases
  inside
  headings
  (e.g.
  "unfair
  advantage")
  */
  h1
  em,
  h2
  em,
  h3
  em,
  .hero-title
  em,
  .page-title
  em
  {
  font-family:
  var(--font-heading);
  font-style:
  italic;
  font-weight:
  400;
  }
  /*
  Body
  text
  default
  */
  p,
  li,
  span,
  label,
  input,
  textarea,
  select,
  button
  {
  font-family:
  var(--font-body);
  }
  /*
  Eyebrow
  pill
  —
  "BUILT
  WITH
  YUKTORA
  INTELLIGENCE"
  style
  */
  .eyebrow,
  .badge-eyebrow,
  [class*="eyebrow"]
  {
  display:
  inline-flex;
  align-items:
  center;
  gap:
  7px;
  background:
  var(--eyebrow-bg);
  color:
  var(--eyebrow-text);
  font-family:
  var(--font-body);
  font-size:
  11px;
  letter-spacing:
  1.4px;
  text-transform:
  uppercase;
  font-weight:
  500;
  padding:
  6px
  12px;
  border-radius:
  999px;
  }
  .eyebrow::before,
  .badge-eyebrow::before
  {
  content:
  '';
  width:
  5px;
  height:
  5px;
  border-radius:
  50%;
  background:
  var(--eyebrow-dot);
  display:
  inline-block;
  flex-shrink:
  0;
  }
  /*
  Cards
  —
  white
  on
  mocha,
  warm-tinted
  shadow
  */
  .card,
  .feature-card,
  .risk-item,
  .pricing-card
  {
  background:
  var(--card-bg);
  border:
  1px
  solid
  var(--border);
  border-radius:
  12px;
  box-shadow:
  var(--shadow-warm);
  }
  /*
  Primary
  CTA
  —
  deep
  chocolate
  */
  .btn-primary,
  .cta-primary,
  button[type="submit"].primary
  {
  background:
  var(--brand);
  color:
  var(--brand-text);
  border:
  none;
  border-radius:
  8px;
  padding:
  11px
  18px;
  font-family:
  var(--font-body);
  font-weight:
  500;
  font-size:
  13px;
  letter-spacing:
  0.2px;
  cursor:
  pointer;
  transition:
  background
  0.2s
  ease;
  }
  .btn-primary:hover,
  .cta-primary:hover
  {
  background:
  var(--brand-hover);
  }
  /*
  Ghost
  /
  secondary
  CTA
  */
  .btn-ghost,
  .btn-secondary,
  .cta-secondary
  {
  background:
  transparent;
  color:
  var(--text-primary);
  border:
  1.5px
  solid
  var(--border);
  border-radius:
  8px;
  padding:
  11px
  18px;
  font-family:
  var(--font-body);
  font-weight:
  500;
  font-size:
  13px;
  cursor:
  pointer;
  transition:
  background
  0.2s
  ease;
  }
  .btn-ghost:hover,
  .btn-secondary:hover
  {
  background:
  var(--eyebrow-bg);
  }
  /*
  Score
  /
  match
  badges
  */
  .score-badge,
  .match-score,
  .score-chip
  {
  background:
  var(--success-bg);
  color:
  var(--success-text);
  padding:
  3px
  9px;
  border-radius:
  999px;
  font-size:
  11.5px;
  font-weight:
  500;
  display:
  inline-block;
  }
  /*
  Form
  inputs
  on
  mocha
  background
  */
  input[type="email"],
  input[type="text"],
  input[type="password"],
  textarea
  {
  background:
  var(--card-bg);
  border:
  1px
  solid
  var(--border);
  border-radius:
  8px;
  padding:
  10px
  12px;
  font-family:
  var(--font-body);
  color:
  var(--text-primary);
  transition:
  border-color
  0.2s
  ease,
  box-shadow
  0.2s
  ease;
  }
  input:focus,
  textarea:focus
  {
  outline:
  none;
  border-color:
  var(--brand);
  box-shadow:
  0
  0
  0
  3px
  rgba(74,
  44,
  26,
  0.08);
  }
  /*
  Secondary
  text
  —
  captions,
  meta,
  subtitles
  */
  .subtitle,
  .caption,
  .meta,
  .text-muted
  {
  color:
  var(--text-secondary);
  }
  /*
  Dividers
  */
  hr,
  .divider
  {
  border:
  none;
  border-top:
  1px
  solid
  var(--divider);
  }
  /*
  Nuclear
  background
  override
  —
  catches
  any
  wrapper
  that
  hijacks
  bg
  */
  body,
  body
  >
  *,
  main,
  .container,
  .wrapper,
  .page,
  .landing,
  .hero,
  .hero-section,
  section.hero,
  div.hero
  {
  background-color:
  var(--page-bg)
  !important;
  }
  /*
  But
  keep
  cards
  and
  specific
  islands
  as
  white
  */
  .card,
  .feature-card,
  .risk-item,
  .pricing-card,
  .dashboard-preview,
  .dashboard-mock
  {
  background:
  var(--card-bg)
  !important;
  }
</style>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter+Tight:wght@400;500;600&display=swap">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Yuktora</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body
  style="background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Outfit', sans-serif;">

  <!-- Form is hidden by default; shown only after the session check confirms no active session -->
  <div id="auth-signin-layer"
    style="display:none; background: white; border: 1px solid var(--border, #e5e7eb); padding: 32px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;">
    <h2 style="margin: 0 0 8px 0; font-size: 1.5rem; font-weight: 700; color: #111827;">Welcome to Yuktora</h2>
    <p style="color: #666; font-size: 0.875rem; margin: 0 0 24px 0;">Secure passwordless sign-in</p>

    <div style="text-align: left; margin-bottom: 16px;">
      <label for="magic-email"
        style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: #374151;">Work
        Email Address</label>
      <input type="email" id="magic-email" placeholder="you@company.com"
        style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; box-sizing: border-box; font-size: 0.875rem;">
    </div>

    <!-- DPDP Compliance Checkbox Block -->
    <div style="display: flex; align-items: flex-start; text-align: left; margin-bottom: 20px;">
      <input type="checkbox" id="auth-consent-check" onchange="toggleMagicLinkBtn()"
        style="margin-top: 3px; margin-right: 8px; cursor: pointer;">
      <label for="auth-consent-check" style="font-size: 0.75rem; color: #4b5563; line-height: 1.4; cursor: pointer;">
        I agree to the processing of my email profile under the terms of the
        <a href="privacy.html" target="_blank" style="color: #0070f3; text-decoration: underline;">Privacy Policy</a>.
      </label>
    </div>

    <button id="btn-magic-link" onclick="sendSupabaseMagicLink()" disabled
      style="width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 0.875rem; opacity: 0.45; cursor: not-allowed; transition: all 0.2s ease; width: 100%;">
      Send Magic Link
    </button>

    <!-- Success confirmation block — hidden until magic link is sent successfully -->
    <div id="magic-link-success"
      style="display:none; margin-top: 16px; padding: 14px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; text-align: left;">
      <div style="font-size: 0.875rem; font-weight: 600; color: #166534; margin-bottom: 6px;">✓ Check your email</div>
      <div style="font-size: 0.8125rem; color: #15803d; line-height: 1.5;">
        We sent a sign-in link to <strong id="magic-link-sent-email"></strong>. Click the link to continue.
      </div>
      <div style="margin-top: 10px; font-size: 0.8125rem; color: #4b5563;">
        Didn't get it? <a href="#" id="magic-link-resend" onclick="resendMagicLink(event)"
          style="color: #0070f3; font-weight: 600; text-decoration: underline;">Resend</a>
      </div>
    </div>

    <!-- Error message block — hidden until an error occurs -->
    <div id="magic-link-error"
      style="display:none; margin-top: 12px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; font-size: 0.8125rem; color: #dc2626; font-weight: 500;">
    </div>
  </div>

  <!-- CDN Dependency loaded first explicitly -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // Configuration parameters
    const SUPABASE_URL = "https://qflgxfqoldrxvchogkkj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbGd4ZnFvbGRyeHZjaG9na2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDEzODAsImV4cCI6MjA5OTc3NzM4MH0.WjMe3xxzIs9xLgDrT20oBTdRcjZzh169gr8x-LkUz9M";

    // Declared global pointer container to avoid ReferenceErrors
    let supabaseClient = null;

    // Safety initialization wrapped inside window lifecycle sequence.
    // Must be async so we can await getSession() before showing any UI.
    async function initSupabaseClient() {
      if (!(window.supabase && typeof window.supabase.createClient === 'function')) {
        console.error("Supabase CDN failed to instantiate global namespace objects.");
        return;
      }

      // Initialise with persistence + URL-based session detection (required for magic links).
      // persistSession and autoRefreshToken are Supabase defaults but are stated explicitly
      // to ensure no override is accidentally introduced later.
      // detectSessionInUrl: true lets the magic-link URL hash establish the session on landing.
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      // ── Session check: redirect immediately if already authenticated ──────────
      // This runs BEFORE any UI is shown so the form never flashes for logged-in users.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.replace('/app');
        return;
      }

      // No active session — reveal the sign-in form now.
      const layer = document.getElementById('auth-signin-layer');
      if (layer) layer.style.display = 'block';

      // ── Auth state listener ───────────────────────────────────────────────────
      // Handles the SIGNED_IN event that fires when the user clicks the magic link
      // in their email (detectSessionInUrl picks up the token from the URL hash).
      // Also handles SIGNED_OUT in another tab — nothing to do here since we're
      // already on the sign-in page.
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
          window.location.replace('/app');
        }
        // SIGNED_OUT: already on signin page — no action needed.
      });
    }

    // Run verification instantly
    if (document.readyState === "complete" || document.readyState === "interactive") {
      initSupabaseClient();
    } else {
      window.addEventListener("DOMContentLoaded", initSupabaseClient);
    }

    // Compliance Checkbox Modifier
    function toggleMagicLinkBtn() {
      const checked = document.getElementById('auth-consent-check')?.checked;
      const btn = document.getElementById('btn-magic-link');
      if (!btn) return;
      btn.disabled = !checked;
      btn.style.opacity = checked ? '1' : '0.45';
      btn.style.cursor = checked ? 'pointer' : 'not-allowed';
    }

    // Issue Supabase Passwordless Login Event
    async function sendSupabaseMagicLink() {
      if (!supabaseClient) {
        return alert("Connection Error: The authorization engine is still loading. Please wait a second and retry.");
      }

      const emailInput = document.getElementById('magic-email')?.value;
      const checkbox = document.getElementById('auth-consent-check');
      if (!checkbox || !checkbox.checked) return alert("You must agree to the privacy policy first.");
      if (!emailInput) return alert("Please type a valid email address.");

      const btn = document.getElementById('btn-magic-link');
      btn.textContent = "Sending Link...";
      btn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email: emailInput,
          options: { emailRedirectTo: window.location.origin + '/app' }
        });

        if (error) {
          // Show inline error, reset button
          const errEl = document.getElementById('magic-link-error');
          if (errEl) {
            errEl.textContent = error.message;
            errEl.style.display = 'block';
          }
          btn.textContent = "Send Magic Link";
          btn.disabled = false;
        } else {
          // Hide button, show success confirmation block
          btn.style.display = 'none';
          const successEl = document.getElementById('magic-link-success');
          const sentEmailEl = document.getElementById('magic-link-sent-email');
          const errEl = document.getElementById('magic-link-error');
          if (errEl) errEl.style.display = 'none';
          if (sentEmailEl) sentEmailEl.textContent = emailInput;
          if (successEl) successEl.style.display = 'block';
        }
      } catch (err) {
        console.error("Unhandled network execution error:", err);
        const errEl = document.getElementById('magic-link-error');
        if (errEl) {
          errEl.textContent = 'Network error — please check your connection and try again.';
          errEl.style.display = 'block';
        }
        btn.textContent = "Send Magic Link";
        btn.disabled = false;
      }
    }

    // Resend: re-show the button and reset state so the user can send again
    function resendMagicLink(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-magic-link');
      const successEl = document.getElementById('magic-link-success');
      const errEl = document.getElementById('magic-link-error');
      if (successEl) successEl.style.display = 'none';
      if (errEl) errEl.style.display = 'none';
      if (btn) {
        btn.style.display = '';
        btn.textContent = 'Send Magic Link';
        // Re-evaluate disabled state based on checkbox
        const checked = document.getElementById('auth-consent-check')?.checked;
        btn.disabled = !checked;
        btn.style.opacity = checked ? '1' : '0.45';
        btn.style.cursor = checked ? 'pointer' : 'not-allowed';
      }
    }
  </script>
</body>

</html>
