<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Yuktora</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Outfit', sans-serif;">

  <div id="auth-signin-layer" style="background: white; border: 1px solid var(--border, #e5e7eb); padding: 32px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;">
    <h2 style="margin: 0 0 8px 0; font-size: 1.5rem; font-weight: 700; color: #111827;">Welcome to Yuktora</h2>
    <p style="color: #666; font-size: 0.875rem; margin: 0 0 24px 0;">Secure passwordless cloud sync via Supabase.</p>
    
    <div style="text-align: left; margin-bottom: 16px;">
      <label for="magic-email" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: #374151;">Work Email Address</label>
      <input type="email" id="magic-email" placeholder="you@company.com" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; box-sizing: border-box; font-size: 0.875rem;">
    </div>

    <!-- DPDP Compliance Checkbox Block -->
    <div style="display: flex; align-items: flex-start; text-align: left; margin-bottom: 20px;">
      <input type="checkbox" id="auth-consent-check" onchange="toggleMagicLinkBtn()" style="margin-top: 3px; margin-right: 8px; cursor: pointer;">
      <label for="auth-consent-check" style="font-size: 0.75rem; color: #4b5563; line-height: 1.4; cursor: pointer;">
        I agree to the processing of my email profile under the terms of the 
        <a href="privacy.html" target="_blank" style="color: #0070f3; text-decoration: underline;">Privacy Policy</a>.
      </label>
    </div>

    <button id="btn-magic-link" onclick="sendSupabaseMagicLink()" disabled style="width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 0.875rem; opacity: 0.45; cursor: not-allowed; transition: all 0.2s ease; width: 100%;">
      Send Magic Link
    </button>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script>
    // Initialize Safe Client-Side Supabase Parameters
    const SUPABASE_URL = "https://qflgxfqoldrxvchogkkj.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbGd4ZnFvbGRyeHZjaG9na2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDEzODAsImV4cCI6MjA5OTc3NzM4MH0.WjMe3xxzIs9xLgDrT20oBTdRcjZzh169gr8x-LkUz9M";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Compliance Checkbox Modifier
    function toggleMagicLinkBtn() {
      const checked = document.getElementById('auth-consent-check')?.checked;
      const btn = document.getElementById('btn-magic-link');
      if (!btn) return;
      btn.disabled = !checked;
      btn.style.opacity = checked ? '1' : '0.45';
      btn.style.cursor = checked ? 'pointer' : 'not-allowed';
    }

    // Issue Supabase Passwordless Login Event
    async function sendSupabaseMagicLink() {
      const emailInput = document.getElementById('magic-email')?.value;
      const checkbox = document.getElementById('auth-consent-check');
      if (!checkbox || !checkbox.checked) return alert("You must agree to the privacy policy first.");
      if (!emailInput) return alert("Please type a valid email address.");

      const btn = document.getElementById('btn-magic-link');
      btn.textContent = "Sending Link...";
      btn.disabled = true;

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: emailInput,
        options: { emailRedirectTo: window.location.origin + '/app.html' }
      });

      if (error) {
        alert("Authentication Error: " + error.message);
        btn.textContent = "Send Magic Link";
        btn.disabled = false;
      } else {
        alert("Magic link issued! Check your email inbox to log in securely.");
      }
    }

    // If a user visits signin but already has a valid cloud session, route them to the dashboard automatically
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        window.location.href = '/app.html';
      }
    });
  </script>
</body>
</html>
