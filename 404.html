<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Yuktora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
<style>
.nf{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding-top:64px;background:linear-gradient(160deg,var(--cream),var(--blush),var(--cream-2))}
.nf-num{font-family:var(--font-display);font-weight:800;font-size:clamp(6rem,18vw,12rem);line-height:1;color:var(--burg);display:block;margin-bottom:6px;opacity:.2}
</style>
</head>
<body>
  <!-- ═══ YUKTORA INTELLIGENCE — full-screen guide overlay ═══ -->
  <link rel="stylesheet" href="/yuktora-bot.css">

  <button class="yb-launcher" id="ybLauncher" aria-label="Reopen Yuktora Intelligence guide" onclick="ybReopen()">
    <div class="yb-dot"></div>
    <svg viewBox="0 0 24 24"><path d="M12 2.5c1 2 2 3 4 4-2 1-3 2-4 4-1-2-2-3-4-4 2-1 3-2 4-4z"/><path d="M4.5 3.2c.5 1 1 1.5 2 2-1 .5-1.5 1-2 2-.5-1-1-1.5-2-2 1-.5 1.5-1 2-2z"/><path d="M3 12.5C3 9.5 6.5 7.5 11 7.5s8 2 8 5-3.5 5-8 5c-.9 0-1.75-.08-2.53-.23L4 19l1.1-3.1C3.8 15 3 13.85 3 12.5z"/></svg>
    <span class="yb-launcher-label">Ask AI</span>
  </button>

  <div class="yb-overlay" id="ybOverlay">
    <button class="yb-overlay-close" onclick="ybClose()" aria-label="Close">&#10005;</button>
    <div class="yb-overlay-inner">
      <div class="yb-ring" id="ybRing">
        <svg class="yb-face-svg" id="ybFaceSvg" viewBox="0 0 120 120">
          <defs>
            <radialGradient id="ybOrbGrad" cx="35%" cy="26%" r="82%">
              <stop offset="0%" stop-color="#F6E7D2"/>
              <stop offset="55%" stop-color="#C9873F"/>
              <stop offset="100%" stop-color="#8A5624"/>
            </radialGradient>
            <radialGradient id="ybSkinGrad" cx="40%" cy="26%" r="82%">
              <stop offset="0%" stop-color="#FCEFDD"/>
              <stop offset="55%" stop-color="#F1D6AF"/>
              <stop offset="100%" stop-color="#DFB98A"/>
            </radialGradient>
            <clipPath id="ybFaceClip"><circle cx="60" cy="60" r="52"/></clipPath>
          </defs>
          <circle cx="60" cy="60" r="52" fill="url(#ybOrbGrad)"/>
          <g clip-path="url(#ybFaceClip)">
            <!-- shoulders / blazer -->
            <path d="M60 81 C 39 81 25 94 24 113 L 96 113 C 95 94 81 81 60 81 Z" fill="#3A1F10"/>
            <path d="M49 85 L60 96 L71 85" stroke="#F1DEC4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
            <!-- neck with soft shadow -->
            <rect x="52" y="65" width="16" height="19" rx="6" fill="#E7C093"/>
            <ellipse cx="60" cy="83" rx="9" ry="3" fill="#C99A6A" opacity=".35"/>
            <!-- head -->
            <ellipse cx="60" cy="47" rx="20.5" ry="21.5" fill="url(#ybSkinGrad)"/>
            <!-- soft jaw shading for dimension -->
            <path d="M42 52 C 43 62 50 68 60 68 C 70 68 77 62 78 52 C 76 60 69 65 60 65 C 51 65 44 60 42 52 Z" fill="#C99A6A" opacity=".18"/>
            <!-- hair: side part, softer silhouette -->
            <path d="M38.5 44 C 36 25 45 12 61 12 C 76 12 84 24 81.5 43
                     C 80 35 77 29 68 27 C 72 25 74 22 73 19
                     C 66 24 55 24 46 22 C 43 26 41 33 40 40
                     C 39.5 41.5 39 42.5 38.5 44 Z" fill="#2E2015"/>
            <path d="M38.5 44 C 37.5 37 39 31 43 27 C 39.5 33 39.5 38 41 45 Z" fill="#241A10"/>
            <path d="M81.5 43 C 82.3 36 80.5 30 76 26.5 C 79.5 32.5 79.7 38 78.3 44.5 Z" fill="#241A10"/>
            <!-- eyebrows: level, soft, sincere -->
            <g id="ybBrows" class="yb-brow" stroke="#4A3624" stroke-width="2.2" stroke-linecap="round" fill="none">
              <path d="M45.5 40.5 Q51 38 56.5 40"/>
              <path d="M63.5 40 Q69 38 74.5 40.5"/>
            </g>
            <!-- eyes: warm brown iris, eyelid crease for sincerity -->
            <g id="ybEyes">
              <g class="yb-eye" id="ybEyeL">
                <path d="M45 45.5 Q51 42 57 45.5" stroke="#8A6A47" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".55"/>
                <ellipse cx="51" cy="47.5" rx="5.2" ry="6.1" fill="#4A3020"/>
                <circle cx="49.4" cy="45.2" r="1.5" fill="#fff" opacity=".85"/>
              </g>
              <g class="yb-eye" id="ybEyeR">
                <path d="M63 45.5 Q69 42 75 45.5" stroke="#8A6A47" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".55"/>
                <ellipse cx="69" cy="47.5" rx="5.2" ry="6.1" fill="#4A3020"/>
                <circle cx="67.4" cy="45.2" r="1.5" fill="#fff" opacity=".85"/>
              </g>
            </g>
            <!-- blush, subtle -->
            <ellipse cx="45.5" cy="56" rx="4.2" ry="2.4" fill="#C9683F" opacity=".16"/>
            <ellipse cx="74.5" cy="56" rx="4.2" ry="2.4" fill="#C9683F" opacity=".16"/>
            <!-- nose -->
            <path d="M60 49 Q58.4 54 60 55.6" stroke="#C99A6A" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".5"/>
            <!-- mouth: warm, full, genuine smile -->
            <path d="M51.5 60.5 Q60 67 68.5 60.5" stroke="#7A4A2A" stroke-width="2.1" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="yb-eq" id="ybEq"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="yb-eyebrow2"><span class="d"></span>A.I. · YUKTORA INTELLIGENCE · YOUR CO-PILOT FOR THIS SEARCH</div>
      <div class="yb-transcript" id="ybTranscript"></div>
      <button class="yb-skip2" onclick="ybClose()">Skip straight to the site &rarr;</button>
      <div class="yb-overlay-foot">
        <input class="yb-ofinput" id="ybInput" type="text" placeholder="Ask about pricing, safety, how it works..." onkeydown="if(event.key==='Enter')ybSend()">
        <button class="yb-ofsend" onclick="ybSend()" title="Send">&#10148;</button>
      </div>
    </div>
  </div>
  <script src="/yuktora-bot.js" defer></script>


<nav class="site-nav">
  <div class="nav-wrap">
    <a href="/" class="nav-logo"><div class="nav-logo-mark">🎯</div>Yuktora</a>
    <div class="nav-right"><a href="/app" class="btn btn-burg btn-sm">Launch App →</a></div>
  </div>
</nav>
<div class="nf">
  <div>
    <span class="nf-num">404</span>
    <h2>This page went looking for a job</h2>
    <p style="max-width:300px;margin:10px auto 28px;font-weight:500;">Looks like this URL doesn't exist. Let's get you back on track.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn btn-burg">Go Home</a>
      <a href="/app" class="btn btn-outline">Launch App →</a>
    </div>
  </div>
</div>
</body>
</html>
